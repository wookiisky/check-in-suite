      properties:
        category_id: {"anyOf": [{"type": "string", "minLength": 1}, {"type": "null"}]}
        name: {"type": "string", "minLength": 1, "maxLength": 40}
        icon_key: {"type": "string", "minLength": 1}
        coin_reward: {"type": "integer", "minimum": 0, "maximum": 1000000}
        diamond_reward: {"type": "integer", "minimum": 0, "maximum": 1000000}
        daily_limit: {"type": "integer", "minimum": 1, "maximum": 1000}
        weekdays: {"type": "array", "minItems": 1, "maxItems": 7, "uniqueItems": true, "items": {"type": "integer", "minimum": 1, "maximum": 7}}
        enabled: {"type": "boolean"}
        expected_version: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
    AvailableTask:
      type: "object"
