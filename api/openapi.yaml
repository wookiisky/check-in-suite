      required: ["id", "category_id", "name", "icon_key", "coin_reward", "diamond_reward", "daily_limit", "weekdays", "enabled", "version", "remaining"]
      properties:
        id: {"type": "string", "minLength": 1}
        category_id: {"anyOf": [{"type": "string", "minLength": 1}, {"type": "null"}]}
        name: {"type": "string", "minLength": 1, "maxLength": 40}
        icon_key: {"type": "string", "minLength": 1}
        coin_reward: {"type": "integer", "minimum": 0, "maximum": 1000000}
        diamond_reward: {"type": "integer", "minimum": 0, "maximum": 1000000}
        daily_limit: {"type": "integer", "minimum": 1, "maximum": 1000}
        weekdays: {"type": "array", "minItems": 1, "maxItems": 7, "uniqueItems": true, "items": {"type": "integer", "minimum": 1, "maximum": 7}}
        enabled: {"type": "boolean"}
        version: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        remaining: {"type": "integer", "minimum": 1, "maximum": 1000}
    TaskList:
      type: "object"
      additionalProperties: false
      required: ["items"]
      properties: {"items": {"type": "array", "items": {"$ref": "#/components/schemas/Task"}}}
    Checkin:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "task_id"
        - "business_date"
        - "task_name_snapshot"
        - "task_icon_snapshot"
        - "coin_reward_snapshot"
