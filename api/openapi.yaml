        earned_at:
          anyOf: [{"type": "string", "format": "date-time"}, {"type": "null"}]
        category:
          anyOf: [{"$ref": "#/components/schemas/AchievementCategoryOption"}, {"type": "null"}]
        tasks:
          type: "array"
          items: {"$ref": "#/components/schemas/AchievementTaskOption"}
      description: "资格按当前成就规则及有效记录重算。删除打卡使成绩不足时收回并卸下；删除任务配置保留历史贡献与排期。重新达标更新获得时间，不恢复佩戴。停用或删除定义停止新授予，但仍重验已获得资格。category与tasks提供所选范围的当前名称及删除状态，和资格来自同一快照；category仅在类别范围非空，tasks与task_ids顺序一致，其他范围返回空数组。"
    AchievementList:
      type: "object"
      additionalProperties: false
      required: ["items"]
      properties:
        items:
          type: "array"
          items: {"$ref": "#/components/schemas/Achievement"}
    AchievementOptions:
      type: "object"
      additionalProperties: false
      required: ["categories", "tasks"]
      properties:
        categories:
          type: "array"
          items: {"$ref": "#/components/schemas/AchievementCategoryOption"}
        tasks:
          type: "array"
          items: {"$ref": "#/components/schemas/AchievementTaskOption"}
    AchievementCategoryOption:
      type: "object"
      additionalProperties: false
      required: ["id", "name", "deleted"]
      properties:
        id: {"type": "string", "minLength": 1}
        name: {"type": "string"}
        deleted: {"type": "boolean"}
    AchievementTaskOption:
      type: "object"
      additionalProperties: false
      required: ["id", "name", "category_id", "deleted"]
      properties:
        id: {"type": "string", "minLength": 1}
        name: {"type": "string"}
        category_id:
          anyOf: [{"type": "string", "minLength": 1}, {"type": "null"}]
        deleted: {"type": "boolean"}
    AchievementEquipment:
      type: "object"
      additionalProperties: false
      required: ["equipped"]
      properties:
        equipped: {"type": "boolean"}
