openapi: "3.1.0"
info:
  title: "成长岛服务接口"
  version: "0.2.0"
  description: "已批准的首版接口契约；端点实现和验收状态见tasks.md。单账户、同源Cookie认证；写请求校验Origin和CSRF。未知字段拒绝，整数不超过JavaScript安全范围。"
servers: [{"url": "/"}]
security: [{"sessionCookie": []}]
paths:
  "/api/v1/island":
    get:
      operationId: "getIsland"
      summary: "读取小岛布局、已拥有物品与当前物品能力"
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IslandState"}}}}
        default: {"$ref": "#/components/responses/Error"}
    put:
      operationId: "saveIsland"
      summary: "按已读取版本原子保存完整小岛布局"
      parameters: [{"$ref": "#/components/parameters/CSRF"}]
      description: "仅需登录，无需管理授权。验证真实所有权、每件实例唯一、室内外范围与房屋环境单选；冲突返回 VERSION_CONFLICT。"
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IslandSave"}}}}
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IslandState"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/health/live":
    get:
      operationId: "getLiveness"
      summary: "检查服务进程"
      security: []
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HealthResponse"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/health/ready":
    get:
      operationId: "getReadiness"
      summary: "检查数据库、迁移和媒体依赖"
      security: []
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HealthResponse"}}}}
        default: {"$ref": "#/components/responses/Error"}
        "503": {"description": "依赖不可用", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HealthResponse"}}}}
  "/api/v1/auth/login":
    post:
      operationId: "login"
      summary: "登录并建立不透明 Cookie 会话"
      security: []
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LoginRequest"}}}}
      description: "校验 Origin；失败限速。密码校验在事务外，建立会话前复核凭据版本。"
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SessionResponse"}}}}
        default: {"$ref": "#/components/responses/Error"}
        "401": {"description": "INVALID_CREDENTIALS；用户名或登录密码错误。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}
  "/api/v1/auth/logout":
    post:
      operationId: "logout"
      summary: "撤销当前会话及管理授权"
      parameters: [{"$ref": "#/components/parameters/CSRF"}]
      responses: {"204": {"description": "成功，无响应体"}, "default": {"$ref": "#/components/responses/Error"}}
  "/api/v1/session":
    get:
      operationId: "getSession"
      summary: "读取账户、授权、日期和生效限制"
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SessionResponse"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/management/unlock":
    post:
      operationId: "unlockManagement"
      summary: "以管理密码进入管理界面"
      parameters: [{"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PasswordRequest"}}}}
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ManagementAuthorization"}}}}
        default: {"$ref": "#/components/responses/Error"}
        "422": {"description": "密码错误或字段校验失败；保留登录和表单，允许就地重试。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}
  "/api/v1/management/lock":
    post:
      operationId: "lockManagement"
      summary: "退出管理并撤销授权"
      parameters: [{"$ref": "#/components/parameters/CSRF"}]
      description: "每次退出管理均调用；再次进入必须重新提交管理密码。失败时客户端隐藏管理内容并保留未确认锁定状态。"
      responses: {"204": {"description": "成功，无响应体"}, "default": {"$ref": "#/components/responses/Error"}}
  "/api/v1/account/profile":
    patch:
      operationId: "updateProfile"
      summary: "修改姓名"
      x-management-required: true
      parameters: [{"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProfileUpdate"}}}}
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Account"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/account/preferences":
    patch:
      operationId: "updatePreferences"
      summary: "仅更新指定偏好字段"
      parameters: [{"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PreferencesUpdate"}}}}
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Preferences"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/account/login-password":
    post:
      operationId: "changeLoginPassword"
      summary: "修改密码并撤销全部会话"
      x-management-required: true
      parameters: [{"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PasswordChange"}}}}
      responses:
        "204": {"description": "成功，无响应体"}
        default: {"$ref": "#/components/responses/Error"}
        "422": {"description": "密码错误或字段校验失败；保留登录和表单，允许就地重试。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}
  "/api/v1/account/management-password":
    post:
      operationId: "changeManagementPassword"
      summary: "修改密码并撤销全部会话"
      x-management-required: true
      parameters: [{"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PasswordChange"}}}}
      responses:
        "204": {"description": "成功，无响应体"}
        default: {"$ref": "#/components/responses/Error"}
        "422": {"description": "密码错误或字段校验失败；保留登录和表单，允许就地重试。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}
  "/api/v1/camp":
    get:
      operationId: "getCamp"
      summary: "一致快照读取今日任务、余额与装备"
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CampResponse"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/checkins":
    get:
      operationId: "listCheckins"
      summary: "按所属日期稳定分页读取有效记录"
      parameters:
        - {"name": "start_date", "in": "query", "required": true, "schema": {"type": "string", "format": "date"}}
        - {"name": "end_date", "in": "query", "required": true, "schema": {"type": "string", "format": "date"}}
        - {"name": "cursor", "in": "query", "required": false, "schema": {"type": "string"}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100}}
      description: "范围包含两端，最多31天；游标包含business_date、created_at、id。next_cursor非空表示尚未加载全部。"
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CheckinList"}}}}
        default: {"$ref": "#/components/responses/Error"}
    post:
      operationId: "createCheckin"
      summary: "新增今日打卡并原子发奖"
      parameters: [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/IdempotencyKey"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CheckinCreate"}}}}
      responses:
        "201": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CheckinResult"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/checkins/{id}":
    patch:
      operationId: "updateCheckin"
      summary: "编辑今日记录内容"
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CheckinUpdate"}}}}
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Checkin"}}}}
        default: {"$ref": "#/components/responses/Error"}
    delete:
      operationId: "deleteCheckin"
      summary: "删除今日记录并回收原奖励"
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/VersionRequest"}}}}
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CheckinDeleteResult"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/management/checkins":
    post:
      operationId: "backfillCheckin"
      summary: "按当前任务配置补录今天或历史"
      x-management-required: true
      parameters: [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/IdempotencyKey"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CheckinBackfill"}}}}
      responses:
        "201": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CheckinResult"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/management/checkins/{id}":
    patch:
      operationId: "manageUpdateCheckin"
      summary: "编辑今日或历史记录内容"
      x-management-required: true
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CheckinUpdate"}}}}
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Checkin"}}}}
        default: {"$ref": "#/components/responses/Error"}
    delete:
      operationId: "manageDeleteCheckin"
      summary: "删除今日或历史记录并回收奖励"
      x-management-required: true
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/VersionRequest"}}}}
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CheckinDeleteResult"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/calendar":
    get:
      operationId: "getCalendar"
      summary: "读取每月有效记录摘要"
      parameters: [{"name": "month", "in": "query", "required": true, "schema": {"type": "string", "pattern": "^\\d{4}-\\d{2}$"}}]
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CalendarResponse"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/stats":
    get:
      operationId: "getStats"
      summary: "按稳定任务标识统计有效次数"
      parameters:
        - {"name": "start_date", "in": "query", "required": true, "schema": {"type": "string", "format": "date"}}
        - {"name": "end_date", "in": "query", "required": true, "schema": {"type": "string", "format": "date"}}
      description: "含两端，最多366天，结束日期不能晚于服务端今天。"
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StatsResponse"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/categories":
    get:
      operationId: "listCategories"
      summary: "读取配置列表"
      parameters: [{"name": "include_inactive", "in": "query", "required": false, "schema": {"type": "boolean"}, "description": "true要求当前会话已解锁管理"}]
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CategoryList"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/management/categories":
    post:
      operationId: "createCategory"
      summary: "新建配置"
      x-management-required: true
      parameters: [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/IdempotencyKey"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CategoryCreate"}}}}
      responses:
        "201": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Category"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/management/categories/{id}":
    patch:
      operationId: "updateCategory"
      summary: "编辑配置并检查版本"
      x-management-required: true
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CategoryUpdate"}}}}
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Category"}}}}
        default: {"$ref": "#/components/responses/Error"}
    delete:
      operationId: "deleteCategory"
      summary: "删除配置并保留历史关联"
      x-management-required: true
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/VersionRequest"}}}}
      responses: {"204": {"description": "成功，无响应体"}, "default": {"$ref": "#/components/responses/Error"}}
  "/api/v1/tasks":
    get:
      operationId: "listTasks"
      summary: "读取配置列表"
      parameters: [{"name": "include_inactive", "in": "query", "required": false, "schema": {"type": "boolean"}, "description": "true要求当前会话已解锁管理"}]
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskList"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/management/tasks":
    post:
      operationId: "createTask"
      summary: "新建配置"
      x-management-required: true
      parameters: [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/IdempotencyKey"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskCreate"}}}}
      responses:
        "201": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Task"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/management/tasks/{id}":
    patch:
      operationId: "updateTask"
      summary: "编辑配置并检查版本"
      x-management-required: true
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskUpdate"}}}}
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Task"}}}}
        default: {"$ref": "#/components/responses/Error"}
    delete:
      operationId: "deleteTask"
      summary: "删除配置并保留历史关联"
      x-management-required: true
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/VersionRequest"}}}}
      responses: {"204": {"description": "成功，无响应体"}, "default": {"$ref": "#/components/responses/Error"}}
  "/api/v1/products":
    get:
      operationId: "listProducts"
      summary: "读取配置列表"
      parameters: [{"name": "include_inactive", "in": "query", "required": false, "schema": {"type": "boolean"}, "description": "true要求当前会话已解锁管理"}]
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProductList"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/management/products":
    post:
      operationId: "createProduct"
      summary: "新建配置"
      x-management-required: true
      parameters: [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/IdempotencyKey"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProductCreate"}}}}
      responses:
        "201": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Product"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/management/products/{id}":
    patch:
      operationId: "updateProduct"
      summary: "编辑配置并检查版本"
      x-management-required: true
      description: "已出售商品不能改为另一物品身份，返回 PRODUCT_ITEM_LOCKED；成交类型变更受 PRODUCT_TYPE_LOCKED 约束。展示与互动能力通过资源定义追加，不改写成交事实。"
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProductUpdate"}}}}
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Product"}}}}
        "409": {"description": "VERSION_CONFLICT、PRODUCT_ITEM_LOCKED 或 PRODUCT_TYPE_LOCKED；保留当前配置。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}
        default: {"$ref": "#/components/responses/Error"}
    delete:
      operationId: "deleteProduct"
      summary: "删除配置并保留历史关联"
      x-management-required: true
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/VersionRequest"}}}}
      responses: {"204": {"description": "成功，无响应体"}, "default": {"$ref": "#/components/responses/Error"}}
  "/api/v1/purchases":
    post:
      operationId: "createPurchase"
      summary: "原子扣除双币并生成订单"
      parameters: [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/IdempotencyKey"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PurchaseCreate"}}}}
      responses:
        "201": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PurchaseResult"}}}}
        default: {"$ref": "#/components/responses/Error"}
    get:
      operationId: "listPurchases"
      summary: "读取装扮或待兑现及已兑现奖励"
      parameters:
        - {"name": "cursor", "in": "query", "required": false, "schema": {"type": "string"}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100}}
        - {"name": "type", "in": "query", "required": false, "schema": {"type": "string", "enum": ["title", "avatar", "background", "accessory", "effect", "reward", "island"]}}
        - {"name": "status", "in": "query", "required": false, "schema": {"type": "string", "enum": ["owned", "pending", "redeemed"]}}
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PurchaseList"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/equipment/{slot}":
    put:
      operationId: "setEquipmentSlot"
      summary: "设置称号、形象或背景槽位"
      parameters:
        - {"name": "slot", "in": "path", "required": true, "schema": {"type": "string", "enum": ["title", "avatar", "background"]}}
        - {"$ref": "#/components/parameters/CSRF"}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SlotUpdate"}}}}
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Equipment"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/equipment/accessories/{purchase_id}":
    put:
      operationId: "putAccessory"
      summary: "装备或卸下单个已拥有饰品"
      parameters: [{"name": "purchase_id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      description: "最多装备10个不同饰品；重复装备/卸下成功，其他饰品不变。"
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AccessoryResult"}}}}
        default: {"$ref": "#/components/responses/Error"}
    delete:
      operationId: "deleteAccessory"
      summary: "装备或卸下单个已拥有饰品"
      parameters: [{"name": "purchase_id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      description: "最多装备10个不同饰品；重复装备/卸下成功，其他饰品不变。"
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AccessoryResult"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/equipment/accessories/{purchase_id}/layout":
    patch:
      operationId: "setAccessoryLayout"
      summary: "保存单件饰品的位置、大小和层级"
      parameters: [{"name": "purchase_id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AccessoryLayoutInput"}}}}
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Equipment"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/equipment/effects/{purchase_id}":
    put:
      operationId: "putEffect"
      summary: "佩戴动态特效"
      description: "单件幂等更新；可同时佩戴多件，不占饰品数量；固定最高层，没有可编辑布局。"
      parameters: [{"name": "purchase_id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AccessoryResult"}}}}
        default: {"$ref": "#/components/responses/Error"}
    delete:
      operationId: "deleteEffect"
      summary: "移除动态特效"
      description: "单件幂等更新；可同时佩戴多件，不占饰品数量；固定最高层，没有可编辑布局。"
      parameters: [{"name": "purchase_id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AccessoryResult"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/purchases/{id}/redeem":
    post:
      operationId: "redeemPurchase"
      summary: "本次输入管理密码兑现奖励"
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PasswordRequest"}}}}
      description: "每次均验证管理密码，即使当前已解锁。兑现不顺带解锁管理页，不再次扣款或库存。"
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Purchase"}}}}
        default: {"$ref": "#/components/responses/Error"}
        "422": {"description": "密码错误或字段校验失败；保留登录和表单，允许就地重试。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}
  "/api/v1/assets":
    get:
      operationId: "listAssets"
      summary: "读取已部署受控素材目录"
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AssetList"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/assets/{key}":
    get:
      operationId: "readAsset"
      summary: "鉴权读取版本化素材"
      parameters:
        - {"name": "key", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}
        - {"name": "motion", "in": "query", "required": false, "schema": {"type": "string", "enum": ["static"]}, "description": "特效素材的静态版本，用于减少动态效果。"}
      responses:
        "200": {"description": "版本化内置素材", "content": {"image/svg+xml": {"schema": {"type": "string", "format": "binary"}}, "image/png": {"schema": {"type": "string", "format": "binary"}}, "image/webp": {"schema": {"type": "string", "format": "binary"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/media":
    post:
      operationId: "uploadMedia"
      summary: "上传并校验一张照片或一段录音"
      parameters: [{"$ref": "#/components/parameters/CSRF"}]
      responses:
        "201": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Media"}}}}
        default: {"$ref": "#/components/responses/Error"}
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: "object"
              additionalProperties: false
              required: ["kind", "file"]
              properties: {"kind": {"type": "string", "enum": ["photo", "audio"]}, "file": {"type": "string", "format": "binary"}}
  "/api/v1/media/{id}":
    get:
      operationId: "readMedia"
      summary: "鉴权读取可访问媒体"
      parameters:
        - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}
        - {"name": "Range", "in": "header", "required": false, "schema": {"type": "string"}}
      responses:
        "200": {"description": "完整媒体，正确MIME、私有缓存、nosniff", "content": {"application/octet-stream": {"schema": {"type": "string", "format": "binary"}}}}
        default: {"$ref": "#/components/responses/Error"}
        "206": {"description": "音频字节范围，带Content-Range", "content": {"application/octet-stream": {"schema": {"type": "string", "format": "binary"}}}}
    delete:
      operationId: "cancelMedia"
      summary: "撤回未关联的媒体"
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      description: "不能删除已关联媒体；解除引用须走记录编辑或删除接口。"
      responses: {"204": {"description": "成功，无响应体"}, "default": {"$ref": "#/components/responses/Error"}}
  "/api/v1/messages":
    get:
      operationId: "listMessages"
      summary: "分页读取家庭留言"
      parameters:
        - {"name": "cursor", "in": "query", "required": false, "schema": {"type": "string"}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100}}
      responses:
        "200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MessageList"}}}}
        default: {"$ref": "#/components/responses/Error"}
    post:
      operationId: "createMessage"
      summary: "新增家庭留言"
      parameters: [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/IdempotencyKey"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MessageCreate"}}}}
      responses:
        "201": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Message"}}}}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/messages/{id}":
    delete:
      operationId: "deleteMessage"
      summary: "删除家庭留言"
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      responses: {"204": {"description": "成功，无响应体"}, "default": {"$ref": "#/components/responses/Error"}}
  "/api/v1/achievements":
    get:
      operationId: "listAchievements"
      summary: "查看可获得及已获得成就"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/AchievementList"}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/management/achievements":
    get:
      operationId: "manageListAchievements"
      summary: "管理成就配置"
      x-management-required: true
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/AchievementList"}
        default: {"$ref": "#/components/responses/Error"}
    post:
      operationId: "createAchievement"
      summary: "创建规则并补授历史达标成就"
      x-management-required: true
      parameters: [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/AchievementCreate"}
      responses:
        "201":
          description: "成功"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Achievement"}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/management/achievements/options":
    get:
      operationId: "achievementOptions"
      summary: "读取含已删除关联的类别和任务"
      x-management-required: true
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/AchievementOptions"}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/management/achievements/{id}":
    patch:
      operationId: "updateAchievement"
      summary: "修改成就并按新规则重算资格"
      x-management-required: true
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/AchievementUpdate"}
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Achievement"}
        default: {"$ref": "#/components/responses/Error"}
    delete:
      operationId: "deleteAchievement"
      summary: "停止新授予并保留已获得成就"
      x-management-required: true
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/VersionRequest"}
      responses:
        "204": {"description": "成功，无响应体"}
        default: {"$ref": "#/components/responses/Error"}
  "/api/v1/achievements/{id}/equipment":
    put:
      operationId: "equipAchievement"
      summary: "佩戴或卸下已获得成就"
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}, {"$ref": "#/components/parameters/CSRF"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/AchievementEquipment"}
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Achievement"}
        default: {"$ref": "#/components/responses/Error"}
components:
  securitySchemes: {"sessionCookie": {"type": "apiKey", "in": "cookie", "name": "island_session"}}
  parameters:
    CSRF: {"name": "X-CSRF-Token", "in": "header", "required": true, "schema": {"type": "string"}}
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema: {"type": "string", "minLength": 1, "maxLength": 128}
      description: "同一明确提交及未知结果重试必须使用原键和原请求；权限检查先于重放。"
  responses:
    Error:
      description: "结构化错误：400输入；401未登录；403授权或CSRF；404不存在；409版本/幂等/业务冲突；422日期或媒体；429限速；503忙或存储不可用。"
      content: {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}
  schemas:
    HealthResponse:
      type: "object"
      additionalProperties: false
      required: ["status"]
      properties: {"status": {"type": "string", "enum": ["ok", "unavailable"]}}
    ApiError:
      type: "object"
      additionalProperties: false
      required: ["code", "field_errors", "request_id"]
      properties:
        code: {"type": "string"}
        field_errors: {"type": "object", "additionalProperties": {"type": "string"}}
        request_id: {"type": "string"}
        current_version: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
    Preferences:
      type: "object"
      additionalProperties: false
      required: ["music_enabled", "effects_enabled", "reduce_motion"]
      properties: {"music_enabled": {"type": "boolean"}, "effects_enabled": {"type": "boolean"}, "reduce_motion": {"type": "boolean"}}
    PreferencesUpdate:
      type: "object"
      additionalProperties: false
      required: []
      properties: {"music_enabled": {"type": "boolean"}, "effects_enabled": {"type": "boolean"}, "reduce_motion": {"type": "boolean"}}
      minProperties: 1
    Account:
      type: "object"
      additionalProperties: false
      required: ["id", "username", "display_name", "version", "preferences"]
      properties:
        id: {"type": "integer", "minimum": 1, "maximum": 1}
        username: {"type": "string"}
        display_name: {"type": "string", "minLength": 1, "maxLength": 40}
        version: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        preferences: {"$ref": "#/components/schemas/Preferences"}
    Limits:
      type: "object"
      additionalProperties: false
      required:
        - "password_min"
        - "password_max"
        - "name_max"
        - "text_max"
        - "message_max"
        - "reward_max"
        - "price_max"
        - "stock_max"
        - "daily_limit_max"
        - "list_days_max"
        - "stats_days_max"
        - "photo_bytes_max"
        - "photo_pixels_max"
        - "photo_edge_max"
        - "audio_bytes_max"
        - "audio_seconds_max"
      properties:
        password_min: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        password_max: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        name_max: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        text_max: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        message_max: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        reward_max: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        price_max: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        stock_max: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        daily_limit_max: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        list_days_max: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        stats_days_max: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        photo_bytes_max: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        photo_pixels_max: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        photo_edge_max: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        audio_bytes_max: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
        audio_seconds_max: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
    SessionResponse:
      type: "object"
      additionalProperties: false
      required: ["account", "csrf_token", "management_expires_at", "server_now", "today", "timezone", "limits"]
      properties:
        account: {"$ref": "#/components/schemas/Account"}
        csrf_token: {"type": "string"}
        management_expires_at: {"anyOf": [{"type": "string", "format": "date-time"}, {"type": "null"}]}
        server_now: {"type": "string", "format": "date-time"}
        today: {"type": "string", "format": "date"}
        timezone: {"type": "string", "enum": ["Asia/Taipei"]}
        limits: {"$ref": "#/components/schemas/Limits"}
    LoginRequest:
      type: "object"
      additionalProperties: false
      required: ["username", "password"]
      properties: {"username": {"type": "string", "minLength": 1}, "password": {"type": "string", "minLength": 10, "maxLength": 128}}
    PasswordRequest:
      type: "object"
      additionalProperties: false
      required: ["password"]
      properties: {"password": {"type": "string", "minLength": 10, "maxLength": 128}}
    ManagementAuthorization:
      type: "object"
      additionalProperties: false
      required: ["management_expires_at"]
      properties: {"management_expires_at": {"type": "string", "format": "date-time"}}
    ProfileUpdate:
      type: "object"
      additionalProperties: false
      required: ["display_name", "expected_version"]
      properties:
        display_name: {"type": "string", "minLength": 1, "maxLength": 40}
        expected_version: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
    PasswordChange:
      type: "object"
      additionalProperties: false
      required: ["old_password", "new_password", "confirm_password"]
      properties:
        old_password: {"type": "string"}
        new_password: {"type": "string", "minLength": 10, "maxLength": 128}
        confirm_password: {"type": "string", "minLength": 10, "maxLength": 128}
    VersionRequest:
      type: "object"
      additionalProperties: false
      required: ["expected_version"]
      properties: {"expected_version": {"type": "integer", "minimum": 1, "maximum": 9007199254740991}}
    Wallet:
      type: "object"
      additionalProperties: false
      required: ["coins", "diamonds", "version"]
      properties:
        coins: {"type": "integer", "minimum": -9007199254740991, "maximum": 9007199254740991}
        diamonds: {"type": "integer", "minimum": -9007199254740991, "maximum": 9007199254740991}
        version: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
    Category:
      type: "object"
      additionalProperties: false
      required: ["id", "name", "sort_order", "version"]
      properties:
        id: {"type": "string", "minLength": 1}
        name: {"type": "string", "minLength": 1, "maxLength": 40}
        sort_order: {"type": "integer", "minimum": 0, "maximum": 9007199254740991}
        version: {"type": "integer", "minimum": 1, "maximum": 9007199254740991}
    CategoryCreate:
      type: "object"
      additionalProperties: false
      required: ["name"]
      properties: {"name": {"type": "string", "minLength": 1, "maxLength": 40}, "sort_order": {"type": "integer", "minimum": 0, "maximum": 9007199254740991}}
    CategoryUpdate:
      type: "object"
      additionalProperties: false
