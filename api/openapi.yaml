        id: {"type": "string", "minLength": 1}
        task_id: {"type": "string", "minLength": 1}
        business_date: {"type": "string", "format": "date"}
        task_name_snapshot: {"type": "string", "minLength": 1, "maxLength": 40}
        task_icon_snapshot: {"type": "string", "minLength": 1}
        coin_reward_snapshot: {"type": "integer", "minimum": 0, "maximum": 1000000}
        diamond_reward_snapshot: {"type": "integer", "minimum": 0, "maximum": 1000000}
