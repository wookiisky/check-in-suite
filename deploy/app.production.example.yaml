# All paths are absolute so maintenance commands and systemd use the same files.
listen_address: 0.0.0.0:38100
public_origin: https://island.example.com
static_directory: /srv/island/current/web
database_path: /srv/island/data/island.db
media_directory: /srv/island/data/media
temp_directory: /srv/island/data/tmp
assets_directory: /srv/island/data/assets
sqlite_busy_timeout: 5s
http_timeout: 10s
upload_timeout: 90s
ffprobe_path: /usr/bin/ffprobe
media_probe_timeout: 3s
session_ttl: 168h
management_ttl: 30m
media_orphan_ttl: 24h
media_cleanup_interval: 1h
limits:
  password_min: 10
  password_max: 128
  name_max: 40
  text_max: 2000
  message_max: 500
  reward_max: 1000000
  price_max: 1000000
  stock_max: 1000000
  daily_limit_max: 1000
  list_days_max: 31
  stats_days_max: 366
  photo_bytes_max: 10485760
  photo_pixels_max: 20000000
  photo_edge_max: 2560
  audio_bytes_max: 10485760
  audio_seconds_max: 60
