<div class="page"><header><h1>成长岛 · 人物形象</h1><p>固定一位男孩和一位女孩，各三种发型。<br>同一人物的脸型、五官、肤色、服装与姿势保持一致。</p></header><section><h2>同一位男孩<span>只改变发型</span></h2><div class="grid"><figure><div class="art"><img src="../../internal/assets/builtin/avatar-boy-short-v1.svg" alt="男孩·短发"></div><figcaption>男孩·短发<small>avatar-boy-short-v1</small></figcaption></figure><figure><div class="art"><img src="../../internal/assets/builtin/avatar-boy-curly-v1.svg" alt="男孩·卷发"></div><figcaption>男孩·卷发<small>avatar-boy-curly-v1</small></figcaption></figure><figure><div class="art"><img src="../../internal/assets/builtin/avatar-boy-sidepart-v1.svg" alt="男孩·侧分发"></div><figcaption>男孩·侧分发<small>avatar-boy-sidepart-v1</small></figcaption></figure></div></section><section><h2>同一位女孩<span>只改变发型</span></h2><div class="grid"><figure><div class="art"><img src="../../internal/assets/builtin/avatar-girl-long-v1.svg" alt="女孩·长发"></div><figcaption>女孩·长发<small>avatar-girl-long-v1</small></figcaption></figure><figure><div class="art"><img src="../../internal/assets/builtin/avatar-girl-braids-v1.svg" alt="女孩·双辫"></div><figcaption>女孩·双辫<small>avatar-girl-braids-v1</small></figcaption></figure><figure><div class="art"><img src="../../internal/assets/builtin/avatar-girl-short-v1.svg" alt="女孩·短发"></div><figcaption>女孩·短发<small>avatar-girl-short-v1</small></figcaption></figure></div></section><footer>6 件透明背景 SVG · 可在角色素材中选用 · 主页、衣柜和小岛使用同一人物形象</footer></div>
